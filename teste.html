<!DOCTYPE html>
<html>

<head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

    <script>
        // Componente para mudar a cor ao clicar
        AFRAME.registerComponent('click-component-test', {
            init: function () {
                const el = this.el; // Referência ao elemento
                const originalColor = el.getAttribute('color'); // Guarda a cor original

                el.addEventListener('click', function () {
                    // Alterna entre a cor original e vermelho
                    const currentColor = el.getAttribute('color');
                    if (currentColor === originalColor) {
                        el.setAttribute('color', '#FF0000'); // Muda para vermelho
                    } else {
                        el.setAttribute('color', originalColor); // Volta para a cor original
                    }
                });
            }
        });

        // Componente para rotacionar a porta 90 graus ao clicar
        AFRAME.registerComponent('rotate-door', {
            init: function () {
                const el = this.el; // Referência ao elemento
                let isRotated = false; // Estado da rotação

                el.addEventListener('click', function () {
                    if (!isRotated) {
                        // Rotaciona a porta 90 graus no eixo Y
                        el.setAttribute('rotation', { y: 90, x: 0, z: 0 });
                        isRotated = true;
                    } else {
                        // Volta a porta para a posição original
                        el.setAttribute('rotation', { y: 0, x: 0, z: 0 });
                        isRotated = false;
                    }
                });
            }
        });
    </script>
</head>

<body>
    <a-scene physics="debug: true; gravity:-9.8;">
        <!-- Cursor para interação -->
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>

        <!-- Cubo com animação e componente de clique -->
        <a-box position="-1 0.5 -3" class="clickable" click-component-test color="#4CC3D9"
            animation="property: position; to: 1 2 -3; dur: 2000; loop: true; dir: alternate" dynamic-body>
        </a-box>

        <!-- Esfera com um anel ao redor -->
        <a-entity position="-5 1.6 0">
            <a-sphere color="#000" radius="0.5"></a-sphere>
            <a-ring position="0 0 0" rotation="-90 0 0" color="#FF0000" radius-inner="0.6" radius-outer="0.8"></a-ring>
        </a-entity>

        <!-- Chão estático -->
        <a-plane position="0 0 -4" rotation="-90 0 0" width="100" height="100" color="#7BC8A4" static-body></a-plane>

        <!-- Céu -->
        <a-sky color="#ECECEC"></a-sky>

        <!-- Cubo físico que cai -->
        <a-box position="-1 4 -3" rotation="0 45 0" color="#4CC3D9" dynamic-body></a-box>
    </a-scene>
</body>

</html>
