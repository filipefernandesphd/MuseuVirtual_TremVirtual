<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Virtual</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Adicionando o componente checkpoint-controls -->
    <script src="./javascript/aframe-interactions-system.js"></script>
    <script src="https://unpkg.com/aframe-checkpoint-controls@1.2.0/dist/aframe-checkpoint-controls.min.js"></script>
    <script src="/javascript/mundo.js"></script>
</head>

<body>
    <a-scene stats="true" xr-mode-ui="cardboardModeEnabled:true" webxr="requiredFeatures: local-floor;" loaded="true"
        renderer="logarithmicDepthBuffer: true; antialias: false;">
        <!-- Céu com cor neutra -->
        <a-sky color="#C0D8E0"></a-sky>
        <a-assets>
            <!-- <a-asset-item id="coluna" src="/assets/base_basic_shaded.glb"></a-asset-item> -->
            <a-asset-item id="porta" src="/assets/porta.glb"></a-asset-item>
            <img id="entrada" src="/texto/entrarNoMuseu.png">
            
        </a-assets>
     
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
        <!-- Cursor para interação -->

        <!-- Câmera com checkpoint-controls -->
        <a-entity id="camera" movement-controls="controls: checkpoint, keyboard" checkpoint-controls="mode: animate">
            <a-entity camera="active: true" position="0 1.6 0" rotate="0 90 0" cursor="rayOrigin: mouse" wasd-controls
                look-controls="pointerLockEnabled: false"></a-entity>
        </a-entity>

        <!-- Checkpoints -->
        <a-circle checkpoint click-component-test class="clickable" position="0 0.15 -5" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="0 0.15 -10" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="0 0.15 -15" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="0 0.15 -20" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="0 0.15 -25" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="0 0.15 -30" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>

            
        <a-entity gltf-model="#porta" entrar class="clickable porta-2-e" rotation="0 180 0" scale="1.5 1.5 1.5" position="0.5 0.1 -35"
            rotation="0 90 0"></a-entity>
        <a-entity gltf-model="#porta" entrar class="clickable porta-2-e" rotation="0 360 0" scale="1.5 1.5 1.5" position="-0.5 0.1 -35"
            rotation="0 90 0"></a-entity>

            

        

        <!-- Grama -->
        <a-plane position="0 0 -4" repeat="30 30" rotation="-90 0 0" width="100" height="100"
            src="./assets/textureGrama.jpg"></a-plane>

        <!-- Piso museu -->
        <!-- <a-plane position="0 0.1 30" repeat="10 10" rotation="-90 0 0" width="45" height="30"
            src="./assets/pisoMuseu.jpg"></a-plane> -->

        <!-- Teto museu -->
        <!-- <a-plane position="0 10 -60" repeat="10 10" rotation="90 0 0" width="45" height="30"
            src="./assets/pisoMuseu.jpg"></a-plane> -->





        <!-- Passarela -->
        <a-plane position="0 0.1 -10" repeat="1 8" rotation="-90 0 0" width="10" height="50"
            src="./assets/passarela.jpg"></a-plane>

        <!-- Paredes -->
        <a-plane position="0 5 -35" rotation="0 -180 0" width="45" height="10"
            src="/assets/texturaParede.jpg"></a-plane>
        <a-plane position="0 5 -35" rotation="0 0 0" width="45" height="10" src="/assets/texturaParede.jpg"></a-plane>

    </a-scene>
</body>

</html>
