<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Virtual</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="./javascript/aframe-interactions-system.js"></script>
    <script src="https://unpkg.com/aframe-checkpoint-controls@1.2.0/dist/aframe-checkpoint-controls.min.js"></script>
    <script src="/javascript/mundo.js"></script>
</head>

<body>
    <a-scene stats="true" xr-mode-ui="cardboardModeEnabled:true" webxr="requiredFeatures: local-floor;" loaded="true"
        renderer="logarithmicDepthBuffer: true; antialias: false;">

        <!-- Entidade pai para centralizar toda a cena -->
        <a-entity id="scene-root" position="0 0 -6" scale="0.5 0.5 0.5"> <!-- Ajuste Z para centralizar -->

            <!-- Piso museu centralizado -->
            <a-plane position="0 0.1 0" repeat="10 10" rotation="-90 0 0" width="45" height="30"
                src="./assets/pisoMuseu.jpg"></a-plane>

            <!-- Teto museu -->
            <a-plane position="0 10 0" repeat="10 10" rotation="90 0 0" width="45" height="30"
                src="./assets/pisoMuseu.jpg"></a-plane>

            <!-- Colunas -->
            <a-entity gltf-model="#coluna" scale="5 5 5" position="20 0.1 10"></a-entity>
            <a-entity gltf-model="#coluna" scale="5 5 5" position="20 0.1 -10"></a-entity>
            <a-entity gltf-model="#coluna" scale="5 5 5" position="-20 0.1 10"></a-entity>
            <a-entity gltf-model="#coluna" scale="5 5 5" position="-20 0.1 -10"></a-entity>

            <!-- Portas -->
            <a-entity gltf-model="#porta" rotate-door class="clickable porta-1-e" scale="2.5 2.5 2.5"
                position="-22.4 0.1 -5" rotation="0 271 0"></a-entity>
            <a-entity gltf-model="#porta" rotate-door class="clickable porta-2-e" scale="2.5 2.5 2.5"
                position="-22.4 0.1 5" rotation="0 271 0"></a-entity>
            <a-entity gltf-model="#porta" rotate-door class="clickable porta-1-d" scale="2.5 2.5 2.5"
                position="22.4 0.1 -5" rotation="0 90 0"></a-entity>
            <a-entity gltf-model="#porta" rotate-door class="clickable porta-2-e" scale="2.5 2.5 2.5"
                position="22.4 0.1 5" rotation="0 90 0"></a-entity>

            <!-- Paredes -->
            <a-plane position="0 5 15" rotation="0 -180 0" width="45" height="10"
                src="/assets/texturaParede.jpg"></a-plane>
            <a-plane position="0 5 -15" rotation="0 0 0" width="45" height="10"
                src="/assets/texturaParede.jpg"></a-plane>
            <a-plane position="-22.5 5 0" rotation="0 90 0" width="30" height="10"
                src="/assets/texturaParede.jpg"></a-plane>
            <a-plane position="22.5 5 0" rotation="0 -90 0" width="30" height="10"
                src="/assets/texturaParede.jpg"></a-plane>

                <a-plane class="clickable" width="0.85" height="2.7" scale="2.5 2.5 2.5" src="assets/historia.jpg"  position="-22.4 1.5 -5.1" rotation="0 90 0"></a-plane>

                <a-plane class="clickable" width="0.85" height="2.7" scale="2.5 2.5 2.5" src="assets/cafe.png"  position="-22.4 1.5 4.9" rotation="0 90 0"></a-plane>
                
                <a-plane class="clickable" width="0.85" height="2.5" scale="2.5 2.5 2.5" src="assets/leopoldina_railway.jpg"  position="22.4 1.5 -4.9" rotation="0 270 0"></a-plane>
                
                <a-plane class="clickable" width="0.85" height="2.6" scale="2.5 2.5 2.5" src="assets/distri.jpg"  position="22.4 1.5 5.1" rotation="0 270 0"></a-plane>
                
            <!-- Textos -->
            <a-image src="/texto/BemVindo.png" position="0 1.6 5" width="2" height="1.5" scale="6 6 6"
                animation="property: position; to: 0 2.2 5; dur: 1500; loop: true; dir: alternate">
            </a-image>

            <a-image src="/texto/historiadoCafe.png" position="-22.3 6 1.8" width="2" height="1.5" scale="6 6 6"
                rotation="0 90 0">
            </a-image>
        </a-entity>

        <a-circle checkpoint click-component-test class="clickable" position="0 0.15 -3" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="4 0.15 -3" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="-4 0.15 -3" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>

        <a-circle checkpoint click-component-test class="clickable" position="4 0.15 -3" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="-4 0.15 -3" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>

        <a-circle checkpoint click-component-test class="clickable" position="7 0.15 -3" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="-7 0.15 -3" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>

        <a-circle checkpoint click-component-test class="clickable" position="7 0.15 -9" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="-7 0.15 -9" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>

        <a-circle checkpoint click-component-test class="clickable" position="4 0.15 -9" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="-4 0.15 -9" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>

        <a-circle checkpoint click-component-test class="clickable" position="0 0.15 -5" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="0 0.15 -7" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>
        <a-circle checkpoint click-component-test class="clickable" position="0 0.15 -9" radius="0.4" color="#EF2D5E"
            rotation="-90 0 0"></a-circle>

        <!-- Elementos globais (fora da entidade pai) -->
        <a-sky color="#C0D8E0"></a-sky>
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
        <a-entity id="camera" movement-controls="controls: checkpoint, keyboard" checkpoint-controls="mode: animate">
            <a-entity camera="active: true" position="0 1.6 0" rotate="0 90 0" cursor="rayOrigin: mouse" wasd-controls
                look-controls="pointerLockEnabled: false"></a-entity>
        </a-entity>

        <a-image src="#mapa" rotation="0 0 0" position="0 1.6 -13.3" width="1.5" height="0.75" scale="3 3 3"
            class="clickable"></a-image>

        <!-- Assets -->
        <a-assets>
            <a-asset-item id="coluna" src="/assets/base_basic_shaded.glb"></a-asset-item>
            <a-asset-item id="porta" src="/assets/porta.glb"></a-asset-item>
            <img id="mapa" src="/assets/mapaManhu.png"></img>
        </a-assets>
    </a-scene>
</body>

</html>
